<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="robots" content="noindex, nofollow">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta
    name="description"
    content="Gabriel Chau's professional portfolio showcasing data analysis and operational improvement in aviation security."
  >
  <title>Gabriel Chau | Business Operating Analyst Portfolio</title>

  <style>
    :root {
      --navy: #0a192f;
      --red: #c8102e;
      --silver: #c0c0c0;
      --white: #ffffff;
      --black: #000000;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: var(--navy);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      line-height: 1.6;
    }

    a {
      color: inherit;
    }

    a:focus-visible {
      outline: 3px solid var(--silver);
      outline-offset: 5px;
    }

    .skip-link {
      position: absolute;
      top: 1rem;
      left: 1rem;
      z-index: 10;
      padding: 0.75rem 1rem;
      transform: translateY(-200%);
      background: var(--white);
      color: var(--navy);
      font-weight: 700;
    }

    .skip-link:focus {
      transform: translateY(0);
    }

    .page {
      min-height: 100vh;
      min-height: 100svh;
      display: flex;
      flex-direction: column;
    }

    .site-header {
      position: relative;
      z-index: 2;
      background: var(--navy);
      border-bottom: 3px solid var(--red);
    }

    .navigation {
      width: min(100% - 3rem, 1120px);
      margin-inline: auto;
      padding-block: 1.25rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem 2rem;
    }

    .brand {
      color: var(--white);
      font-size: 1.75rem;
      font-weight: 700;
      letter-spacing: 0.025em;
      text-decoration: none;
    }

    .nav-links {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.75rem;
      margin: 0;
      padding: 0;
      list-style: none;
    }

    .nav-links a {
      display: inline-block;
      padding-block: 0.65rem;
      border-bottom: 3px solid transparent;
      color: var(--white);
      font-size: 0.95rem;
      text-decoration: none;
    }

    .nav-links a:hover {
      border-bottom-color: var(--silver);
    }

    .nav-links a[aria-current="page"] {
      border-bottom-color: var(--red);
      font-weight: 700;
    }

    main {
      flex: 1;
      display: flex;
    }

    .hero {
      position: relative;
      isolation: isolate;
      overflow: hidden;
      width: 100%;
      min-height: 650px;
      min-height: min(80svh, 900px);
      display: grid;
      place-items: center;
      padding: clamp(5rem, 12vw, 9rem) 1.5rem;
      background: var(--navy);
    }

    .hero-video,
    .hero-overlay {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    .hero-video {
      z-index: -2;
      object-fit: cover;
      object-position: center;
      pointer-events: none;
    }

    .hero-overlay {
      z-index: -1;
      background-color: rgba(10, 25, 47, 0.65);
      pointer-events: none;
    }

    .hero-content {
      width: min(100%, 960px);
      text-align: center;
    }

    .hero-content::before {
      content: "";
      display: block;
      width: 4rem;
      height: 4px;
      margin: 0 auto 1.75rem;
      background: var(--red);
    }

    h1 {
      max-width: 22ch;
      margin: 0 auto;
      color: var(--white);
      font-size: clamp(2.25rem, 5.5vw, 4.5rem);
      font-weight: 700;
      line-height: 1.15;
      letter-spacing: -0.025em;
      text-wrap: balance;
      overflow-wrap: break-word;
    }

    .cta {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      max-width: 100%;
      min-height: 52px;
      margin-top: 2.5rem;
      padding: 1rem 1.75rem;
      border: 2px solid var(--red);
      border-radius: 4px;
      background: var(--red);
      color: var(--white);
      font-size: 1rem;
      font-weight: 700;
      line-height: 1.5;
      text-decoration: none;
      transition:
        background-color 180ms ease,
        border-color 180ms ease,
        color 180ms ease;
    }

    .cta:hover {
      border-color: var(--silver);
      background: var(--silver);
      color: var(--navy);
    }

    .site-footer {
      padding: 1.5rem;
      border-top: 1px solid var(--silver);
      color: var(--navy);
      text-align: center;
      font-size: 0.875rem;
      background: var(--white);
    }

    .site-footer p {
      margin: 0;
    }

    @media (max-width: 600px) {
      .navigation {
        flex-direction: column;
        align-items: flex-start;
      }

      .nav-links {
        gap: 0.5rem 1.25rem;
      }

      .hero {
        padding-inline: 1.25rem;
      }

      .cta {
        padding-inline: 1.25rem;
      }
    }
  </style>
</head>

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>

  <div class="page">
    <header class="site-header">
      <nav class="navigation" aria-label="Main navigation">
        <a class="brand" href="index.html">Gabriel Chau</a>

        <ul class="nav-links">
          <li>
            <a href="index.html" aria-current="page">Home</a>
          </li>
          <li>
            <a href="about.html">About Me</a>
          </li>
          <li>
            <a href="skills-projects.html">Skills &amp; Projects</a>
          </li>
        </ul>
      </nav>
    </header>

    <main id="main-content">
      <section class="hero" aria-labelledby="hero-heading">
        <video
          id="hero-video"
          class="hero-video"
          autoplay
          muted
          loop
          playsinline
          preload="metadata"
          aria-hidden="true"
          tabindex="-1"
        >
          <source
            src="hero-corp-loop.mp4"
            type="video/mp4"
          >
        </video>

        <div class="hero-overlay" aria-hidden="true"></div>

        <div class="hero-content">
          <h1 id="hero-heading">
            Driving Operational Excellence in Aviation Security
          </h1>

          <a class="cta" href="skills-projects.html">
            Explore My Data Analysis Projects
          </a>
        </div>
      </section>
    </main>

    <footer class="site-footer">
      <p>&copy; Gabriel Chau</p>
    </footer>
  </div>
</body>
</html>
